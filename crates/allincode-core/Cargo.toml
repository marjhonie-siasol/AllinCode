[package]
name = "allincode-core"
version = "0.1.0"
edition = "2021"

[dependencies]
boa_engine = "0.22.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
tokio = { version = "1.43", features = ["full"] }
